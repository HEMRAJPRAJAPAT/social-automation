databases:
  - name: reel-automation-db
    plan: free
    databaseName: reel_automation
    user: reel_user

services:
  - type: web
    name: reel-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Wired automatically from the database above — no manual entry needed.
      - key: DATABASE_URL
        fromDatabase:
          name: reel-automation-db
          property: connectionString

      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: STORAGE_ROOT
        value: ./storage
      # Must match this service's actual assigned Render URL (check the
      # dashboard if the service is ever renamed) — Instagram's servers fetch
      # the rendered video from this URL, so a wrong host here means every
      # publish fails with the container ending up in ERROR status.
      - key: PUBLIC_BASE_URL
        value: https://social-automation-f7b9.onrender.com/media

      - key: CRON
        value: 0 18 * * *
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: RUN_ON_STARTUP
        value: false

      - key: CONTENT_NICHE
        value: AI for Developers
      - key: CONTENT_LANGUAGE
        value: en
      - key: CONTENT_POSTING_FREQUENCY
        value: daily
      - key: CONTENT_VIDEO_DURATION_SECONDS
        value: 30
      - key: CONTENT_WRITING_STYLE
        value: friendly, concise, expert but approachable

      - key: GEMINI_TEXT_MODEL
        value: gemini-flash-latest
      - key: GEMINI_TTS_MODEL
        value: ''
      - key: VOICE_PROVIDER
        value: espeak

      - key: STORAGE_PROVIDER
        value: local
      - key: INSTAGRAM_GRAPH_API_VERSION
        value: v20.0
      # Gemini's 503 ("model overloaded") is a documented transient condition
      # that Google's own SDK retries up to 4x with delays escalating toward
      # 60s; 3 attempts at a 1000ms base gave up after ~5-10s total, far
      # short of that window. 5 attempts at a 2000ms base gives ~30s+.
      - key: RETRY_MAX_ATTEMPTS
        value: 5
      - key: RETRY_BASE_DELAY_MS
        value: 2000
      - key: BACKGROUND_MUSIC_PATH
        value: ''

      # Secrets — deliberately left blank here (sync: false means Render
      # prompts you to fill these in via the dashboard instead of storing
      # the value in this committed file).
      - key: GEMINI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: PAGE_ID
        sync: false
      - key: BUSINESS_ACCOUNT_ID
        sync: false
      # Shared secret required in the X-Trigger-Secret header on POST /trigger
      # — that endpoint can cause a real Instagram publish, so it must not be
      # callable by anyone who finds the URL.
      - key: TRIGGER_SECRET
        sync: false
